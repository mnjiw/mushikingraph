name: Update subscriber counts

on:
  schedule:
    # 15:00 UTC = 00:00 JST (毎日日本時間0時に起動)
    - cron: "0 15 * * *"
  workflow_dispatch: {}  # Actionsタブから手動実行もできるようにする

# 動作中に別の実行が重ならないようにする(手動実行と定期実行が重複した場合など)
concurrency:
  group: update-subscribers
  cancel-in-progress: false

permissions:
  contents: write  # character.csv / CSVchar / site/data をpushするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: YouTube Data APIで登録者数を取得し、CSVを更新する
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_subscribers.py

      - name: site/data/ を再生成する
        run: python scripts/build_data.py

      - name: 変更があればコミット&プッシュする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add character.csv CSVchar/ site/data/
          if git diff --cached --quiet; then
            echo "変更なし。コミットはスキップします。"
          else
            git commit -m "登録者数を自動更新 ($(date -u +%Y-%m-%d))"
            git push
          fi
